server:
  port: ${DISCOVERY-SERVICE_PORT}

spring:
  config:
    import: file:private-info.properties
  application:
    name: ${DISCOVERY-SERVICE_NAME}

  cloud:
    config:
      uri: http://localhost:8761
      fail-fast: false
      import-check:
        enabled: false

  eureka:
    instance:
      hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/