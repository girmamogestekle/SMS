server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sms-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: sms
          __path__: /var/log/sms/*.log
